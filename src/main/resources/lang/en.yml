# English translations for DuckHunt.
# Formatting uses MiniMessage tags, e.g. <gradient:#FBDA00:#A89200>...</gradient>.
# Placeholders like <id> are substituted by the plugin, keep them as-is.

prefix: "<gray>[<italic><gradient:#FBDA00:#A89200><b>Duck</b></gradient><gradient:#B3B3B3:#696969><st>Hunt</st></gradient>]</gray> "

reload:
  success: "<gradient:#B3B3B3:#696969>Configuration reloaded.</gradient>"

permission:
  denied: "<gradient:#B3B3B3:#696969>You don't have permission to do that.</gradient>"

spawnpoint:
  set: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> saved at your location.</gradient>"
  amount-set: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> now keeps up to </gradient><gradient:#FBDA00:#A89200><amount></gradient><gradient:#B3B3B3:#696969> duck(s) alive at once.</gradient>"
  removed: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> removed.</gradient>"
  not-found: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> was not found.</gradient>"
  list-header: "<gradient:#B3B3B3:#696969>Configured spawn points:</gradient>"
  list-entry: "<gradient:#B3B3B3:#696969> - </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> (</gradient><gradient:#FBDA00:#A89200><world></gradient><gradient:#B3B3B3:#696969>: </gradient><gradient:#FBDA00:#A89200><x></gradient><gradient:#B3B3B3:#696969>, </gradient><gradient:#FBDA00:#A89200><y></gradient><gradient:#B3B3B3:#696969>, </gradient><gradient:#FBDA00:#A89200><z></gradient><gradient:#B3B3B3:#696969>) </gradient><gradient:#FBDA00:#A89200><active></gradient><gradient:#B3B3B3:#696969>/</gradient><gradient:#FBDA00:#A89200><amount></gradient><gradient:#B3B3B3:#696969> [</gradient><gradient:#FBDA00:#A89200><waypoints></gradient><gradient:#B3B3B3:#696969> waypoint(s)]</gradient>"
  list-empty: "<gradient:#B3B3B3:#696969>There are no spawn points configured yet. Use /duckhunt admin spawner create [id].</gradient>"

spawn:
  success: "<gradient:#B3B3B3:#696969>Spawned </gradient><gradient:#FBDA00:#A89200><count></gradient><gradient:#B3B3B3:#696969> duck(s) at </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>.</gradient>"
  all-success: "<gradient:#B3B3B3:#696969>Spawned </gradient><gradient:#FBDA00:#A89200><count></gradient><gradient:#B3B3B3:#696969> duck(s) across all spawn points.</gradient>"
  already-full: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> is already at full capacity.</gradient>"

cleared: "<gradient:#B3B3B3:#696969>All ducks have been removed.</gradient>"

auto:
  started: "<gradient:#B3B3B3:#696969>Automatic spawning started.</gradient>"
  stopped: "<gradient:#B3B3B3:#696969>Automatic spawning stopped.</gradient>"
  already-running: "<gradient:#B3B3B3:#696969>Automatic spawning is already running.</gradient>"
  already-stopped: "<gradient:#B3B3B3:#696969>Automatic spawning is already stopped.</gradient>"

kill:
  broadcast: "<gradient:#FBDA00:#A89200><player></gradient> <gradient:#B3B3B3:#696969>caught a duck!</gradient>"

top:
  header: "<gradient:#B3B3B3:#696969>Top duck hunters:</gradient>"
  entry: "<gradient:#B3B3B3:#696969> - #</gradient><gradient:#FBDA00:#A89200><rank></gradient><gradient:#B3B3B3:#696969> </gradient><gradient:#FBDA00:#A89200><player></gradient><gradient:#B3B3B3:#696969> - </gradient><gradient:#FBDA00:#A89200><points></gradient><gradient:#B3B3B3:#696969> point(s) (</gradient><gradient:#FBDA00:#A89200><kills></gradient><gradient:#B3B3B3:#696969> kill(s))</gradient>"
  empty: "<gradient:#B3B3B3:#696969>No leaderboard kills yet. Kills only count from at least the configured distance away.</gradient>"
  points-earned: "<gradient:#FBDA00:#A89200>+<points></gradient> <gradient:#B3B3B3:#696969>point(s)! [<total>]</gradient>"
  reset: "<gradient:#B3B3B3:#696969>Reset </gradient><gradient:#FBDA00:#A89200><player></gradient><gradient:#B3B3B3:#696969>'s leaderboard entry.</gradient>"
  reset-all: "<gradient:#B3B3B3:#696969>Reset the entire leaderboard.</gradient>"
  reset-not-found: "<gradient:#FBDA00:#A89200><player></gradient><gradient:#B3B3B3:#696969> has no leaderboard entry to reset.</gradient>"

settings:
  broadcast-global: "<gradient:#B3B3B3:#696969>Kill broadcasts are now sent to every online player.</gradient>"
  broadcast-radius: "<gradient:#B3B3B3:#696969>Kill broadcasts now only reach players within </gradient><gradient:#FBDA00:#A89200><radius></gradient><gradient:#B3B3B3:#696969> block(s) of the kill.</gradient>"

path:
  added: "<gradient:#B3B3B3:#696969>Waypoint added to </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>'s path (</gradient><gradient:#FBDA00:#A89200><count></gradient><gradient:#B3B3B3:#696969> total).</gradient>"
  removed: "<gradient:#B3B3B3:#696969>Waypoint </gradient><gradient:#FBDA00:#A89200><index></gradient><gradient:#B3B3B3:#696969> removed from </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>'s path.</gradient>"
  invalid-index: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> has no waypoint </gradient><gradient:#FBDA00:#A89200><index></gradient><gradient:#B3B3B3:#696969>.</gradient>"
  cleared: "<gradient:#B3B3B3:#696969>Cleared </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>'s waypoint path.</gradient>"
  mode-set: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>'s path mode is now </gradient><gradient:#FBDA00:#A89200><mode></gradient><gradient:#B3B3B3:#696969>.</gradient>"
  list-header: "<gradient:#B3B3B3:#696969>Waypoints for </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>:</gradient>"
  list-entry: "<gradient:#B3B3B3:#696969> - #</gradient><gradient:#FBDA00:#A89200><index></gradient><gradient:#B3B3B3:#696969> (</gradient><gradient:#FBDA00:#A89200><x></gradient><gradient:#B3B3B3:#696969>, </gradient><gradient:#FBDA00:#A89200><y></gradient><gradient:#B3B3B3:#696969>, </gradient><gradient:#FBDA00:#A89200><z></gradient><gradient:#B3B3B3:#696969>)</gradient>"
  list-empty: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> has no waypoints yet. Use /duckhunt admin spawner <id> path add.</gradient>"

event:
  announce-start: "<gradient:#FBDA00:#A89200><bold>EVENT</bold></gradient> <gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969> just started at </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>! You have </gradient><gradient:#FBDA00:#A89200><time></gradient><gradient:#B3B3B3:#696969> to score the most points.</gradient>"
  actionbar: "<gradient:#FBDA00:#A89200><time></gradient>"
  milestone: "<gradient:#FBDA00:#A89200><name></gradient> <gradient:#FBDA00:#A89200><seconds></gradient><gradient:#B3B3B3:#696969> second(s) left!</gradient>"
  announce-winner: "<gradient:#FBDA00:#A89200><bold>EVENT</bold></gradient> <gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969> is over! </gradient><gradient:#FBDA00:#A89200><winner></gradient><gradient:#B3B3B3:#696969> wins with </gradient><gradient:#FBDA00:#A89200><points></gradient><gradient:#B3B3B3:#696969> point(s)!</gradient>"
  no-winner: "<gradient:#FBDA00:#A89200><bold>EVENT</bold></gradient> <gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969> is over — nobody scored any points.</gradient>"
  winner-title-main: "<gradient:#FBDA00:#A89200><bold><name></bold></gradient>"
  winner-title-sub: "<gradient:#FBDA00:#A89200><winner></gradient><gradient:#B3B3B3:#696969> wins with </gradient><gradient:#FBDA00:#A89200><points></gradient><gradient:#B3B3B3:#696969> point(s)!</gradient>"
  already-active: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> already has an active event.</gradient>"
  not-active: "<gradient:#B3B3B3:#696969>Spawn point </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> has no active event.</gradient>"
  start-confirm: "<gradient:#B3B3B3:#696969>Started event </gradient><gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969> at </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> for </gradient><gradient:#FBDA00:#A89200><time></gradient><gradient:#B3B3B3:#696969>.</gradient>"
  stopped: "<gradient:#B3B3B3:#696969>Ended the event at </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>.</gradient>"
  list-header: "<gradient:#B3B3B3:#696969>Active events:</gradient>"
  list-entry: "<gradient:#B3B3B3:#696969> - </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> (</gradient><gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969>) </gradient><gradient:#FBDA00:#A89200><time></gradient><gradient:#B3B3B3:#696969> left</gradient>"
  list-empty: "<gradient:#B3B3B3:#696969>There are no active events right now.</gradient>"

usage:
  main: "<gradient:#B3B3B3:#696969>Usage: /duckhunt [top|admin]</gradient>"
  admin: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin [spawner|spawn|clear|start|stop|reload|top|settings|event]</gradient>"
  spawner: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin spawner [list|create|remove|id] ...</gradient>"
  spawner-create: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin spawner create [id] [amount]</gradient>"
  spawner-remove: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin spawner remove [id]</gradient>"
  max: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin spawner [id] max [amount]</gradient>"
  spawn: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin spawn [id|all]</gradient>"
  path: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin spawner [id] path [add|list|remove|clear|mode] [index|mode]</gradient>"
  admin-top: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin top reset [player|all]</gradient>"
  admin-settings: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin settings broadcast [global|radius <blocks>]</gradient>"
  event: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin event [start|stop|list] ...</gradient>"
  event-start: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin event start [spawner] [duration] [name]</gradient>"
  event-stop: "<gradient:#B3B3B3:#696969>Usage: /duckhunt admin event stop [spawner]</gradient>"

error:
  players-only: "<gradient:#B3B3B3:#696969>This command can only be used by a player.</gradient>"
  unknown-subcommand: "<gradient:#B3B3B3:#696969>Unknown subcommand.</gradient>"
  invalid-amount: "<gradient:#B3B3B3:#696969>Amount must be a whole number of 1 or higher.</gradient>"
  invalid-path-mode: "<gradient:#B3B3B3:#696969>Invalid path mode. Use loop, pingpong or stop.</gradient>"
  invalid-duration: "<gradient:#B3B3B3:#696969>Invalid duration. Use a combination like 10m, 90s or 1h30m.</gradient>"