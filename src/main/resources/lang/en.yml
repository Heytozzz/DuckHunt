# English translations for DuckHunt.
# Formatting uses MiniMessage tags, e.g. <green>...</green>.
# Placeholders like <id> are substituted by the plugin, keep them as-is.

prefix: "<gray>[<green>DuckHunt</green>]</gray> "

reload:
  success: "<green>Configuration reloaded.</green>"

permission:
  denied: "<red>You don't have permission to do that.</red>"

spawnpoint:
  set: "<green>Spawn point <yellow><id></yellow> saved at your location.</green>"
  amount-set: "<green>Spawn point <yellow><id></yellow> now keeps up to <yellow><amount></yellow> duck(s) alive at once.</green>"
  removed: "<green>Spawn point <yellow><id></yellow> removed.</green>"
  not-found: "<red>Spawn point <yellow><id></yellow> was not found.</red>"
  list-header: "<green>Configured spawn points:</green>"
  list-entry: "<gray> - <yellow><id></yellow> <dark_gray>(<world>: <x>, <y>, <z>)</dark_gray> <gray><active>/<amount> <dark_gray>[<waypoints> waypoint(s)]</dark_gray></gray>"
  list-empty: "<yellow>There are no spawn points configured yet. Use /duckhunt setspawn [id].</yellow>"

spawn:
  success: "<green>Spawned <yellow><count></yellow> duck(s) at <yellow><id></yellow>.</green>"
  all-success: "<green>Spawned <yellow><count></yellow> duck(s) across all spawn points.</green>"
  already-full: "<yellow>Spawn point <yellow><id></yellow> is already at full capacity.</yellow>"

cleared: "<green>All ducks have been removed.</green>"

auto:
  started: "<green>Automatic spawning started.</green>"
  stopped: "<yellow>Automatic spawning stopped.</yellow>"
  already-running: "<yellow>Automatic spawning is already running.</yellow>"
  already-stopped: "<yellow>Automatic spawning is already stopped.</yellow>"

kill:
  broadcast: "<yellow><player></yellow> <green>caught a duck!</green>"

path:
  added: "<green>Waypoint added to <yellow><id></yellow>'s path (<yellow><count></yellow> total).</green>"
  removed: "<green>Waypoint <yellow><index></yellow> removed from <yellow><id></yellow>'s path.</green>"
  invalid-index: "<red>Spawn point <yellow><id></yellow> has no waypoint <yellow><index></yellow>.</red>"
  cleared: "<green>Cleared <yellow><id></yellow>'s waypoint path.</green>"
  mode-set: "<green>Spawn point <yellow><id></yellow>'s path mode is now <yellow><mode></yellow>.</green>"
  list-header: "<green>Waypoints for <yellow><id></yellow>:</green>"
  list-entry: "<gray> - <yellow>#<index></yellow> <dark_gray>(<x>, <y>, <z>)</dark_gray>"
  list-empty: "<yellow>Spawn point <yellow><id></yellow> has no waypoints yet. Use /duckhunt add path <id>.</yellow>"

usage:
  main: "<yellow>Usage: /duckhunt [setspawn|setamount|removespawn|list|spawn|clear|start|stop|reload|add|path]</yellow>"
  setspawn: "<yellow>Usage: /duckhunt setspawn [id] [amount]</yellow>"
  setamount: "<yellow>Usage: /duckhunt setamount [id] [amount]</yellow>"
  removespawn: "<yellow>Usage: /duckhunt removespawn [id]</yellow>"
  spawn: "<yellow>Usage: /duckhunt spawn [id|all]</yellow>"
  addpath: "<yellow>Usage: /duckhunt add path [id]</yellow>"
  path: "<yellow>Usage: /duckhunt path [list|remove|clear|mode] [id] [index|mode]</yellow>"

error:
  players-only: "<red>This command can only be used by a player.</red>"
  unknown-subcommand: "<red>Unknown subcommand.</red>"
  invalid-amount: "<red>Amount must be a whole number of 1 or higher.</red>"
  invalid-path-mode: "<red>Invalid path mode. Use loop, pingpong or stop.</red>"
