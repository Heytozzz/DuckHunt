  winner-title-main: "<gradient:#FBDA00:#A89200><bold><name></bold></gradient>"
  winner-title-sub: "<gradient:#FBDA00:#A89200><winner></gradient><gradient:#B3B3B3:#696969> gana con </gradient><gradient:#FBDA00:#A89200><points></gradient><gradient:#B3B3B3:#696969> punto(s)!</gradient>"
  reward-received: "<gradient:#B3B3B3:#696969>¡Recibiste tu recompensa por quedar en el puesto </gradient><gradient:#FBDA00:#A89200>#<rank></gradient><gradient:#B3B3B3:#696969> de </gradient><gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969>!</gradient>"
