# Traducciones al español para DuckHunt.
# El formato usa etiquetas MiniMessage, ej: <green>...</green>.
# Los marcadores como <id> son reemplazados por el plugin, no los borres.

prefix: "<gray>[<green>DuckHunt</green>]</gray> "

reload:
  success: "<green>Configuración recargada.</green>"

permission:
  denied: "<red>No tienes permiso para hacer eso.</red>"

spawnpoint:
  set: "<green>Punto de aparición <yellow><id></yellow> guardado en tu ubicación.</green>"
  amount-set: "<green>El punto de aparición <yellow><id></yellow> ahora mantiene hasta <yellow><amount></yellow> pato(s) a la vez.</green>"
  removed: "<green>Punto de aparición <yellow><id></yellow> eliminado.</green>"
  not-found: "<red>No se encontró el punto de aparición <yellow><id></yellow>.</red>"
  list-header: "<green>Puntos de aparición configurados:</green>"
  list-entry: "<gray> - <yellow><id></yellow> <dark_gray>(<world>: <x>, <y>, <z>)</dark_gray> <gray><active>/<amount> <dark_gray>[<waypoints> waypoint(s)]</dark_gray></gray>"
  list-empty: "<yellow>Todavía no hay puntos de aparición configurados. Usa /duckhunt admin spawner create [id].</yellow>"

spawn:
  success: "<green>Se generaron <yellow><count></yellow> pato(s) en <yellow><id></yellow>.</green>"
  all-success: "<green>Se generaron <yellow><count></yellow> pato(s) en total.</green>"
  already-full: "<yellow>El punto de aparición <yellow><id></yellow> ya está a máxima capacidad.</yellow>"

cleared: "<green>Se eliminaron todos los patos.</green>"

auto:
  started: "<green>Generación automática iniciada.</green>"
  stopped: "<yellow>Generación automática detenida.</yellow>"
  already-running: "<yellow>La generación automática ya está activa.</yellow>"
  already-stopped: "<yellow>La generación automática ya está detenida.</yellow>"

kill:
  broadcast: "<yellow><player></yellow> <green>¡cazó un pato!</green>"

top:
  header: "<green>Top cazadores de patos:</green>"
  entry: "<gray> - <yellow>#<rank></yellow> <white><player></white> <dark_gray>-</dark_gray> <yellow><kills></yellow> pato(s)"
  empty: "<yellow>Todavía no hay kills en el leaderboard. Solo cuentan los patos eliminados desde la distancia mínima configurada.</yellow>"
  reset: "<green>Se reinició el registro de <yellow><player></yellow> en el leaderboard.</green>"
  reset-all: "<green>Se reinició todo el leaderboard.</green>"
  reset-not-found: "<yellow><player> no tiene registro en el leaderboard para reiniciar.</yellow>"

settings:
  broadcast-global: "<green>Los avisos de kills ahora se envían a todos los jugadores conectados.</green>"
  broadcast-radius: "<green>Los avisos de kills ahora solo llegan a jugadores a menos de <yellow><radius></yellow> bloque(s) de la eliminación.</green>"

path:
  added: "<green>Waypoint añadido al camino de <yellow><id></yellow> (<yellow><count></yellow> en total).</green>"
  removed: "<green>Waypoint <yellow><index></yellow> eliminado del camino de <yellow><id></yellow>.</green>"
  invalid-index: "<red>El punto de aparición <yellow><id></yellow> no tiene el waypoint <yellow><index></yellow>.</red>"
  cleared: "<green>Se vació el camino de waypoints de <yellow><id></yellow>.</green>"
  mode-set: "<green>El modo de camino de <yellow><id></yellow> ahora es <yellow><mode></yellow>.</green>"
  list-header: "<green>Waypoints de <yellow><id></yellow>:</green>"
  list-entry: "<gray> - <yellow>#<index></yellow> <dark_gray>(<x>, <y>, <z>)</dark_gray>"
  list-empty: "<yellow>El punto de aparición <yellow><id></yellow> todavía no tiene waypoints. Usa /duckhunt admin spawner <id> path add.</yellow>"

usage:
  main: "<yellow>Uso: /duckhunt [top|admin]</yellow>"
  admin: "<yellow>Uso: /duckhunt admin [spawner|spawn|clear|start|stop|reload|top|settings]</yellow>"
  spawner: "<yellow>Uso: /duckhunt admin spawner [list|create|remove|id] ...</yellow>"
  spawner-create: "<yellow>Uso: /duckhunt admin spawner create [id] [amount]</yellow>"
  spawner-remove: "<yellow>Uso: /duckhunt admin spawner remove [id]</yellow>"
  max: "<yellow>Uso: /duckhunt admin spawner [id] max [amount]</yellow>"
  spawn: "<yellow>Uso: /duckhunt admin spawn [id|all]</yellow>"
  path: "<yellow>Uso: /duckhunt admin spawner [id] path [add|list|remove|clear|mode] [índice|modo]</yellow>"
  admin-top: "<yellow>Uso: /duckhunt admin top reset [jugador|all]</yellow>"
  admin-settings: "<yellow>Uso: /duckhunt admin settings broadcast [global|radius <bloques>]</yellow>"

error:
  players-only: "<red>Este comando solo puede usarse en el juego.</red>"
  unknown-subcommand: "<red>Subcomando desconocido.</red>"
  invalid-amount: "<red>La cantidad debe ser un número entero de 1 o más.</red>"
  invalid-path-mode: "<red>Modo de camino inválido. Usa loop, pingpong o stop.</red>"
