  stopped: "<gradient:#B3B3B3:#696969>Se terminó el evento de </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969>.</gradient>"
  list-header: "<gradient:#B3B3B3:#696969>Eventos activos:</gradient>"
  list-entry: "<gradient:#B3B3B3:#696969> - </gradient><gradient:#FBDA00:#A89200><id></gradient><gradient:#B3B3B3:#696969> (</gradient><gradient:#FBDA00:#A89200><name></gradient><gradient:#B3B3B3:#696969>) </gradient><gradient:#FBDA00:#A89200><time></gradient><gradient:#B3B3B3:#696969> restante, </gradient><gradient:#FBDA00:#A89200><winners></gradient><gradient:#B3B3B3:#696969> ganador(es)</gradient>"
