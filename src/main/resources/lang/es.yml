# Traducciones al español para DuckHunt.
# El formato usa etiquetas MiniMessage, ej: <gradient:#FBDA00:#A89200>...</gradient>.
# Los marcadores como <id> son reemplazados por el plugin, no los borres.

prefix: "<gray>[<italic><gradient:#FBDA00:#A89200><b>Duck</b></gradient><gradient:#B3B3B3:#696969><st>Hunt</st></gradient>]</gray> "

reload:
  success: "<gradient:#B3B3B3:#696969>Configuración recargada.</gradient>"

permission:
