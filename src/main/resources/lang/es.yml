  list-entry: "<gradient:#B3B3B3:#696969> - #</gradient><gradient:#FBDA00:#A89200><index></gradient><gradient:#B3B3B3:#696969> (</gradient><gradient:#FBDA00:#A89200><x></gradient><gradient:#B3B3B3:#696969>, </gradient><gradient:#FBDA00:#A89200><y></gradient><gradient:#B3B3B3:#696969>, </gradient><gradient:#FBDA00:#A89200><z></gradient><gradient:#B3B3B3:#696969>)</gradient>"
