# =========================================================
#  DuckHunt configuration
# =========================================================
# Spawn point locations live in their own file: spawnpoints.yml.

# Stats applied to every zombie ("duck") that gets spawned.
duck:
  # Max health / current health of the zombie. Lower = dies in fewer hits.
  health: 2.0
  # Base movement speed attribute. Purely cosmetic here since the zombie
  # is a passenger and doesn't walk on its own, but kept for completeness
  # in case you disable riding logic in your own code later.
  movement-speed: 0.23
  # Whether the zombie keeps vanilla AI (targeting/attacking players).
  # Most duck-hunt setups want this off so the zombie is a passive target.
  ai-enabled: false
  # Whether the zombie is silent (no growl/hurt sounds).
  silent: true
  # Whether the zombie glows (useful while testing spawn points).
  glowing: false

spawn:
  # Default number of ducks kept alive at once per spawn point. Individual
  # spawn points can override this in spawnpoints.yml (or via
  # "/duckhunt setspawn <id> <amount>" / "/duckhunt setamount <id> <amount>").
  default-amount: 1
  # If true, the instant a duck dies, a replacement duck spawns right away
  # at the same point instead of waiting for the next auto-spawn cycle or
  # a manual "/duckhunt spawn".
  instant-respawn: false

# Automatic spawning: periodically re-fills every spawn point that's
# below its configured amount.
auto-spawn:
  enabled: false
  interval-seconds: 20

# Broadcasts a message to the whole server whenever a duck is killed.
broadcast-kill: true
