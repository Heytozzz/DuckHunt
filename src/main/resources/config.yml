# =========================================================
#  DuckHunt configuration
# =========================================================
# Spawn point locations and waypoint paths live in their own file:
# spawnpoints.yml.

# Stats applied to every mob ("duck") that gets spawned.
duck:
  # Pool of mob types a duck is randomly picked from every time one is
  # spawned. Must be valid Bukkit EntityType names that map to a mob
  # (Zombie, Skeleton, Spider, Husk, Drowned, Rabbit, Chicken, Pig, Cow,
  # Sheep, Villager, etc.). Unknown or non-mob entries are skipped with a
  # warning at startup/reload; if nothing valid is left, falls back to a
  # single ZOMBIE. Careful with mobs that explode or ranged-attack
  # (Creeper, Skeleton archers with AI enabled) — they're allowed, but
  # behave like their vanilla selves besides the changes below.
  types: [ZOMBIE, HUSK, SKELETON, SPIDER, DROWNED]
  # Max health / current health of the duck. Lower = dies in fewer hits.
  health: 1.0
  # Each duck's movement speed is randomly rolled in this range (applied
  # as the movement_speed attribute AND the speed used by the pathfinder
  # when "ai-enabled" is true, see below). Typical walking speed is
  # around 0.2-0.3; faster ducks are also worth more leaderboard points
  # (see "leaderboard.min-points"/"max-points" below).
  speed:
    min: 0.35
    max: 0.55
  # Whether the duck actively patrols its spawn point's waypoint path
  # using real pathfinding AI (dodges obstacles, climbs stairs, etc.).
  # - true:  the duck's default vanilla AI (attacking, wandering...) is
  #          wiped, and it's driven only by its waypoint path instead.
  #          If a spawn point has no extra waypoints, it just stands at
  #          its spawn location.
  # - false: the duck has no AI at all and stays completely still,
  #          regardless of any configured path (legacy behaviour).
  ai-enabled: true
  # Whether the duck is silent (no growl/hurt/hiss sounds).
  silent: true
  # Whether the duck glows (useful while testing spawn points/paths).
  glowing: false
  # Ducks always have collisions with other entities disabled (not
  # configurable) so a fast duck can freely overtake a slower one
  # instead of pushing/bumping into it.

spawn:
  # Default number of ducks kept alive at once per spawn point. Individual
  # spawn points can override this in spawnpoints.yml (or via
  # "/duckhunt admin spawner create <id> <amount>" / "/duckhunt admin spawner <id> max <amount>").
  default-amount: 1
  # If true, the instant a duck dies, a replacement duck spawns right away
  # at the same point instead of waiting for the next auto-spawn cycle or
  # a manual "/duckhunt admin spawn".
  instant-respawn: true
  # What a duck does after reaching the last waypoint of its path.
  # Individual spawn points can override this in spawnpoints.yml (or via
  # "/duckhunt admin spawner <id> path mode <mode>").
  #   loop     - goes back to the first waypoint (its spawn point) and starts over.
  #   pingpong - walks the path backwards until it reaches the start, then forwards again.
  #   stop     - stays put once it reaches the last waypoint.
  default-path-mode: loop
  # How often (in ticks, 20 ticks = 1 second) the plugin checks whether
  # each duck has reached its current waypoint and needs to be sent to
  # the next one. Lower = more responsive, slightly more overhead.
  path-check-interval-ticks: 10

# Automatic spawning: periodically re-fills every spawn point that's
# below its configured amount.
auto-spawn:
  enabled: true
  interval-seconds: 20

# Duck kill leaderboard ("/duckhunt top").
leaderboard:
  # Minimum distance (in blocks) between the killer and the duck at the
  # moment of death for the kill to count towards the leaderboard. Meant
  # to reward ranged/skillful kills over standing next to the duck.
  min-kill-distance: 10.0
  # How many entries "/duckhunt top" shows.
  top-size: 10
  # Points awarded per qualifying kill, linearly scaled by how fast the
  # duck was: a duck rolled at "duck.speed.min" is worth "min-points",
  # one rolled at "duck.speed.max" is worth "max-points", and anything
  # in between is interpolated.
  min-points: 1
  max-points: 3

# Broadcasts a message whenever a duck is killed (independent from
# whether that kill counted towards the leaderboard above).
kill-broadcast:
  enabled: true
  # global - sent to every online player.
  # radius - only sent to players within "radius" blocks of the kill.
  mode: radius
  radius: 100.0

# Sounds and particles played when a duck spawns / is caught. Both
# "sounds" and "particles" accept any number of entries, and every entry
# listed plays at once (e.g. two sounds and a particle together).
#
# Individual spawn points can override either (or both) of these
# entirely by adding their own "effects.spawn"/"effects.death" section in
# spawnpoints.yml — see that file's template for the exact layout. A
# spawn point with no "effects" section of its own just uses these
# defaults.
effects:
  spawn:
    sounds:
      # "sound" accepts a vanilla shorthand key (resolved as
      # "minecraft:<key>") or a custom resource-pack key in
      # "namespace:key" form (e.g. "htz:duck_quack_spawn") — the client
      # just stays silent if it doesn't have that sound.
      - sound: entity.chicken.egg
        volume: 1.0
        pitch: 1.3
    particles:
      # "particle" is a org.bukkit.Particle name (case-insensitive). The
      # offsets are a random spread around the spawn point on each axis;
      # "speed" is the particle's extra motion/data value.
      - particle: poof
        count: 8
        offset-x: 0.3
        offset-y: 0.3
        offset-z: 0.3
        speed: 0.02
  death:
    sounds:
      - sound: entity.generic.explode
        volume: 0.4
        pitch: 1.7
      - sound: entity.experience_orb.pickup
        volume: 0.8
        pitch: 1.0
    particles:
      - particle: smoke
        count: 10
        offset-x: 0.4
        offset-y: 0.4
        offset-z: 0.4
        speed: 0.05
      - particle: cloud
        count: 6
        offset-x: 0.3
        offset-y: 0.3
        offset-z: 0.3
        speed: 0.02
