# =========================================================
#  DuckHunt configuration
# =========================================================
# Spawn point locations and waypoint paths live in their own file:
# spawnpoints.yml.

# Stats applied to every mob ("duck") that gets spawned.
duck:
  # Pool of mob types a duck is randomly picked from every time one is
  # spawned. Must be valid Bukkit EntityType names that map to a mob
  # (Zombie, Skeleton, Spider, Husk, Drowned, Rabbit, Chicken, Pig, Cow,
  # Sheep, Villager, etc.). Unknown or non-mob entries are skipped with a
  # warning at startup/reload; if nothing valid is left, falls back to a
  # single ZOMBIE. Careful with mobs that explode or ranged-attack
  # (Creeper, Skeleton archers with AI enabled) — they're allowed, but
  # behave like their vanilla selves besides the changes below.
  # NOTE: ENDERMAN is intentionally excluded here. It's not a bug in
  # this plugin — vanilla Minecraft hardcodes Endermen to always
  # teleport away right before a projectile (arrow, snowball, etc.)
  # would hit them, at the entity level rather than through the AI goal
  # system this plugin can strip. There's no supported way to disable
  # that from a plugin, so it's left out of the default pool. Add it
  # back at your own risk if you're fine with players only being able
  # to melee it.
  types: [ZOMBIE, HUSK, SKELETON, WITHER_SKELETON, WITCH, CREEPER, ZOMBIFIED_PIGLIN, VINDICATOR, PILLAGER, EVOKER, BLAZE, EVOKER, HUSK, BOGGED, STRAY]
  # Max health / current health of the duck. Lower = dies in fewer hits.
  health: 1.0
  # Each duck's movement speed is randomly rolled in this range (applied
  # as the movement_speed attribute AND the speed used by the pathfinder
  # when "ai-enabled" is true, see below). Typical walking speed is
  # around 0.2-0.3; faster ducks are also worth more leaderboard points
  # (see "leaderboard.min-points"/"max-points" below).
  speed:
    min: 0.35
    max: 0.65
  # Whether the duck actively patrols its spawn point's waypoint path
  # using real pathfinding AI (dodges obstacles, climbs stairs, etc.).
  # - true:  the duck's default vanilla AI (attacking, wandering...) is
  #          wiped, and it's driven only by its waypoint path instead.
  #          If a spawn point has no extra waypoints, it just stands at
  #          its spawn location.
  # - false: the duck has no AI at all and stays completely still,
  #          regardless of any configured path (legacy behaviour).
  ai-enabled: true
  # Whether the duck is silent (no growl/hurt/hiss sounds).
  silent: true
  # Whether the duck glows (useful while testing spawn points/paths).
  glowing: false

  # A newly-spawned duck has a small chance of being "rare": always
  # glowing (regardless of "glowing" above), faster, worth more points,
  # and trailing its own particle effect — a more valuable, more
  # noticeable target to go for.
  rare:
    enabled: true
    # Chance (0.0-1.0) that a given spawn roll is rare.
    chance: 0.05
    # Multiplies the duck's normally-rolled speed (from "speed" above).
    speed-multiplier: 1.6
    # Multiplies the points it's worth on top of the normal speed-based
    # formula (see "leaderboard.min-points"/"max-points" below) — e.g.
    # 4.0 means 4x the points a normal duck at that same (already
    # multiplied) speed would be worth. Set to 1.0 for no points bonus,
    # just the visual/speed difference.
    points-multiplier: 4.0
    # The particle trailing behind it while it's alive. "particle" is an
    # org.bukkit.Particle name (case-insensitive); the offsets are a
    # random spread around it on each axis, "speed" is the particle's
    # extra motion/data value.
    particle:
      particle: end_rod
      count: 4
      offset-x: 0.2
      offset-y: 0.3
      offset-z: 0.2
      speed: 0.0
    # How often (in ticks) the trail particle is spawned.
    particle-interval-ticks: 4

  # Ducks always have collisions with other entities disabled (not
  # configurable) so a fast duck can freely overtake a slower one
  # instead of pushing/bumping into it.

spawn:
  # Default number of ducks kept alive at once per spawn point. Individual
  # spawn points can override this in spawnpoints.yml (or via
  # "/duckhunt admin spawner create <id> <amount>" / "/duckhunt admin spawner <id> max <amount>").
  default-amount: 1
  # If true, the instant a duck dies, a replacement duck spawns right away
  # at the same point instead of waiting for the next auto-spawn cycle or
  # a manual "/duckhunt admin spawn".
  instant-respawn: true
  # What a duck does after reaching the last waypoint of its path.
  # Individual spawn points can override this in spawnpoints.yml (or via
  # "/duckhunt admin spawner <id> path mode <mode>").
  #   loop     - goes back to the first waypoint (its spawn point) and starts over.
  #   pingpong - walks the path backwards until it reaches the start, then forwards again.
  #   stop     - stays put once it reaches the last waypoint.
  default-path-mode: loop
  # How often (in ticks, 20 ticks = 1 second) the plugin checks whether
  # each duck has reached its current waypoint and needs to be sent to
  # the next one. Lower = more responsive, slightly more overhead.
  path-check-interval-ticks: 10

# Automatic spawning: periodically re-fills every spawn point that's
# below its configured amount.
auto-spawn:
  enabled: false
  interval-seconds: 3

# Duck kill leaderboard ("/duckhunt top").
leaderboard:
  # Minimum distance (in blocks) between the killer and the duck at the
  # moment of death for the kill to count towards the leaderboard. Meant
  # to reward ranged/skillful kills over standing next to the duck.
  min-kill-distance: 10.0
  # How many entries "/duckhunt top" shows.
  top-size: 10
  # Points awarded per qualifying kill, linearly scaled by how fast the
  # duck was: a duck rolled at "duck.speed.min" is worth "min-points",
  # one rolled at "duck.speed.max" is worth "max-points", and anything
  # in between is interpolated.
  min-points: 1
  max-points: 3

# Duck-kill combo/streak system: chaining kills close together builds a
# streak, giving your arrows a particle trail and multiplying the points
# your qualifying kills are worth. Going quiet for too long resets it.
combo:
  enabled: true
  # Max seconds allowed between two consecutive duck kills for the
  # streak to keep climbing. Any kill counts towards a streak, even one
  # too close-range to qualify for leaderboard points itself.
  window-seconds: 5.0
  # How often (in ticks) streaks are checked for expiry and every
  # in-flight "combo arrow"'s trail is advanced.
  tick-interval-ticks: 4
  # Fallback particle for any tier below that doesn't set its own
  # "particle" section. Same shape as one entry under "effects" above.
  # Use "particle: none" to mean "no trail at all" instead of an actual
  # particle — that's what the default below does: reaching the x5 tier
  # only grants its points bonus, with the trail itself only kicking in
  # once a higher tier (x10+) explicitly sets its own "particle".
  default-particle:
    particle: none
    count: 2
    offset-x: 0.05
    offset-y: 0.05
    offset-z: 0.05
    speed: 0.0
  # Milestones: reaching "combo" kills in a row (without the streak
  # expiring) gives arrows shot from then on "particle" as a trail (until
  # the streak either climbs into a higher tier or expires) and
  # multiplies qualifying kills' points by "points-multiplier". Listing
  # order doesn't matter (they're sorted automatically), but each
  # "combo" value should be unique.
  tiers:
    - combo: 5
      points-multiplier: 1.2
      particle:
        particle: happy_villager
        count: 4
        offset-x: 0.06
        offset-y: 0.06
        offset-z: 0.06
        speed: 0.0
    - combo: 10
      points-multiplier: 1.5
      particle:
        particle: flame
        count: 8
        offset-x: 0.06
        offset-y: 0.06
        offset-z: 0.06
        speed: 0.0
    - combo: 20
      points-multiplier: 2.0
      particle:
        particle: end_rod
        count: 8
        offset-x: 0.08
        offset-y: 0.08
        offset-z: 0.08
        speed: 0.0
  # A sound that plays (to the killer only) on every kill that advances
  # a streak, with its pitch climbing a bit further each time so a long
  # streak feels increasingly urgent — once the pitch would reach 2.0 it
  # wraps back down to 1.0 rather than climbing forever.
  sound:
    enabled: true
    sound: block.trial_spawner.spawn_item
    volume: 1.0
    # How much the pitch climbs per kill, e.g. with the default 0.1:
    # kill 1 -> 1.0, kill 2 -> 1.1, ... kill 11 wraps back to 1.0.
    pitch-step: 0.1
    # A separate, one-off sound that plays (to that player only) the
    # moment their streak breaks — unlike the climbing sound above, this
    # one always plays at a fixed pitch.
    lost-enabled: true
    lost-sound: entity.villager.no
    lost-volume: 1.0
    lost-pitch: 1.0
  # How the current streak count ("Combo: xN") is shown to the killer.
  # Every mode below shows the exact same text, just through a
  # different channel:
  #   chat          - a normal chat message.
  #   actionbar     - the action bar (default).
  #   title         - a Title with an invisible main line and the combo
  #                   count as its subtitle.
  #   floating-text - text that floats upward and shrinks away right in
  #                   front of the killer, landing with a random
  #                   left/right/up/down offset each time. Also used to
  #                   announce a broken streak, on top of the chat
  #                   message that mode always gets too.
  display:
    mode: floating-text
    # Only used when mode is "floating-text":
    floating-text:
      # How far in front of the killer's eyes (in blocks) it appears.
      distance: 1.2
      # Maximum random left/right and up/down offset (in blocks) from
      # directly in front of them.
      spread: 0.4
      # How many blocks it drifts upward before disappearing.
      rise: 0.85
      # How long (in ticks) the float-up-and-shrink animation takes.
      duration-ticks: 30

# Broadcasts a message whenever a duck is killed (independent from
# whether that kill counted towards the leaderboard above).
kill-broadcast:
  enabled: true
  # global - sent to every online player.
  # radius - only sent to players within "radius" blocks of the kill.
  mode: radius
  radius: 100.0

# Sounds and particles played when a duck spawns / is caught. Both
# "sounds" and "particles" accept any number of entries, and every entry
# listed plays at once (e.g. two sounds and a particle together).
#
# Individual spawn points can override either (or both) of these
# entirely by adding their own "effects.spawn"/"effects.death" section in
# spawnpoints.yml — see that file's template for the exact layout. A
# spawn point with no "effects" section of its own just uses these
# defaults.
effects:
  spawn:
    sounds:
      - sound: entity.chicken.egg
        volume: 30.0
        pitch: 1.5
    particles:
      - particle: happy_villager
        count: 5
  death:
    sounds:
      - sound: entity.rabbit.hurt
        volume: 30.0
        pitch: 1.5
    particles:
      - particle: cloud
        count: 12

# Timed events ("/duckhunt admin event start <spawner> <duration> [name]
# [winners]"): whoever scores the most points at that spawn point before
# the timer hits zero wins. Only kills of ducks spawned at that exact
# spawn point count (and must still qualify under
# "leaderboard.min-kill-distance" above, worth the same points as the
# persistent leaderboard). Multiple events can run at once, one per
# spawn point.
#
# Every channel below (start/countdown/winner) is configured
# independently:
#   global - sent to every online player.
#   radius - only sent to players within "radius" blocks of the event's
#            spawn point.
#   world  - only sent to players currently in one of "worlds".
event:
  # Seconds remaining at which the countdown announces a milestone in
  # chat (e.g. "5 seconds left!"). Doesn't have to be sorted.
  milestone-seconds: [60, 30, 5, 4, 3, 2, 1]
  # Whether the winner announcement also pops up as a title, in addition
  # to the chat message. When there's more than one winner, titles are
  # revealed one at a time, starting from last place and counting down
  # to the winner (see "winner-reveal-interval-ticks" below).
  winner-title-enabled: true
  # Ticks (20 = 1 second) between each placement's title reveal when
  # winner-title-enabled is true and there's more than one winner.
  winner-reveal-interval-ticks: 30
  # How many top-scoring players are declared winners when an event
  # ends, unless a different amount is given as the last argument of
  # "/duckhunt admin event start <spawner> <duration> [name] [winners]".
  default-winner-count: 1
  # Console commands run once per winner when an event ends (skipped
  # entirely if nobody scored any points), picked by their final
  # placement — "1" for 1st place, "2" for 2nd, and so on. A placement
  # with no list of its own falls back to "default"; if that's also
  # missing/empty, nothing runs and that winner gets no reward-received
  # message either. Works with whatever economy/reward plugin you
  # already have — this just runs its command(s).
  # Placeholders: %player% (their name), %points% (their score), %rank%
  # (their placement, e.g. 1), %id% (spawn point id), %name% (event
  # name).
  winner-rewards:
    "1": []
    default: []
  # Examples (uncomment/adapt to whatever plugin you use):
  #  "1":
  #    - "eco give %player% 500"
  #    - "give %player% diamond 3"
  #    - "lp user %player% permission settemp duckhunt.champion true 1d"
  #  "2":
  #    - "eco give %player% 250"
  #  "3":
  #    - "eco give %player% 100"
  #  default:
  #    - "eco give %player% 50"

  # Announced once when the event starts.
  start:
    mode: global
    radius: 50.0
    worlds: [world]
  # The action-bar timer (MM:SS) shown throughout the event, plus the
  # milestone chat announcements above — same audience for both, since
  # they're really the same "countdown" from a player's perspective.
  countdown:
    mode: radius
    radius: 100.0
    worlds: [world]
  # The final "so-and-so won!" announcement (and title, if enabled).
  winner:
    mode: global
    radius: 50.0
    worlds: [world]
