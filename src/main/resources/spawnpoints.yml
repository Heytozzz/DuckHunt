# =========================================================
#  DuckHunt spawn points
# =========================================================
# You normally don't need to edit this by hand:
#
# 1. Stand where you want a duck to appear and run
#    "/duckhunt admin spawner create <id> [amount]" in-game. That command
#    writes an entry here automatically.
# 2. Optionally, walk to each point you want the duck to patrol through
#    (in order) and run "/duckhunt admin spawner <id> path add" at each
#    one to build its waypoint chain. If a point has no waypoints, its
#    duck just stands still at the spawn location.
# 3. Manage waypoints with "/duckhunt admin spawner <id> path list|remove|clear"
#    and the loop/pingpong/stop behaviour with
#    "/duckhunt admin spawner <id> path mode <mode>".
#
# "amount" is optional per spawn point. Omit it (or use
# "/duckhunt admin spawner <id> max <amount>" to change it later) to fall
# back to "spawn.default-amount" in config.yml.
#
# "path-mode" is optional per spawn point. Omit it to fall back to
# "spawn.default-path-mode" in config.yml.
#
# "effects.spawn"/"effects.death" are optional per spawn point, hand-edited
# only (no command sets them). Omit either section entirely to fall back
# to "effects.spawn"/"effects.death" in config.yml for that event. Same
# "sounds"/"particles" layout as config.yml — see there for the field
# reference. A spawn point can override just one of the two events and
# still fall back to the default for the other.
#
# Manual layout reference, if you'd rather edit this by hand:
#
# points:
#   duck1:
#     world: world
#     x: 0.5
#     y: 65.0
#     z: 0.0
#     yaw: 0.0
#     amount: 3
#     path-mode: loop
#     path:
#       - x: 5.5
#         y: 65.0
#         z: 0.0
#       - x: 5.5
#         y: 65.0
#         z: 8.0
#     effects:
#       spawn:
#         sounds:
#           - sound: htz:duck_quack_spawn
#             volume: 1.0
#             pitch: 1.0
#         particles:
#           - particle: happy_villager
#             count: 5
#       death:
#         sounds:
#           - sound: htz:duck_quack_death
#             volume: 1.0
#             pitch: 0.9
#         particles:
#           - particle: cloud
#             count: 12
points: {}
