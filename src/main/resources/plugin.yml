name: DuckHunt
version: '${project.version}'
main: dev.heytozzz.duckhunt.DuckHuntPlugin
api-version: '26.2'
author: Heytozzz
description: >-
  A duck-hunting minigame where "ducks" are zombies that patrol a chain of
  waypoints using real pathfinding AI.
website: https://github.com/Heytozzz/DuckHunt
load: POSTWORLD

commands:
  duckhunt:
    description: Manage the DuckHunt minigame.
    usage: '/<command> <top|spawner|spawn|clear|start|stop|reload>'
    aliases: [dh]

permissions:
  duckhunt.admin:
    description: Allows management of the DuckHunt minigame.
    default: op
  duckhunt.user:
    description: Allows viewing the DuckHunt kill leaderboard.
    default: true
