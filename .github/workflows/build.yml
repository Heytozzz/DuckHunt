name: Build DuckHunt plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Allows running it manually from the Actions tab without pushing
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload jar as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuckHunt-1.5.0
          path: target/DuckHunt-1.5.0.jar
          if-no-files-found: error
